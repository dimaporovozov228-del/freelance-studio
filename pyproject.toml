[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-studio-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5,<4"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1", "alembic>=1.13,<2"]
test = ["httpx>=0.27,<1"]

[project.scripts]
sheet-studio = "studio.cli:main"
job-scout = "studio.scout:main"
order-desk = "studio.orderdesk.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
"studio.orderdesk" = ["migrations/*.py", "migrations/versions/*.py"]
